<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Simulations · Soccer Pucks</title>
    <link rel="stylesheet" href="css/style.css?v=ui-refresh-1" />
  </head>
  <body class="sim-page">
    <main class="sim-shell">
      <header class="sim-header">
        <div>
          <span class="sim-kicker">Developer tools</span>
          <h1>AI simulation report</h1>
          <p>Headless gameplay checks for positioning, actions, kicks, and powers.</p>
        </div>
        <a class="tiny-btn sim-back" href="./"><span aria-hidden="true">&larr;</span> Back to game</a>
      </header>
      <p id="sim-status" class="sim-status" role="status" aria-live="polite" aria-atomic="true">Running simulation suite…</p>
      <pre id="sim-output"></pre>
    </main>

    <script type="module">
      import { runAllScenarios } from './ai-sim-test.mjs';

      const output = document.getElementById('sim-output');
      const status = document.getElementById('sim-status');
      try {
        output.textContent = await runAllScenarios();
        status.textContent = 'Simulation suite complete';
      } catch (error) {
        output.textContent = `Simulation failed\n\n${error?.stack || error}`;
        status.textContent = 'Simulation suite failed';
      }
    </script>
  </body>
</html>
